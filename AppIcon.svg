<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21242E"/>
      <stop offset="100%" stop-color="#0E0F14"/>
    </linearGradient>
    <linearGradient id="phoneBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C5366"/>
      <stop offset="50%" stop-color="#242834"/>
      <stop offset="100%" stop-color="#141720"/>
    </linearGradient>
    <linearGradient id="leftScreenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="rightScreenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#240D1E"/>
      <stop offset="100%" stop-color="#120610"/>
    </linearGradient>
    <linearGradient id="neonDiffGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#FF5252"/>
    </linearGradient>
    <linearGradient id="cyanAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <filter id="phoneShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="curtainGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="phoneDisplayClip">
      <rect x="150" y="80" width="212" height="352" rx="36"/>
    </clipPath>
    <clipPath id="leftDisplayHalf">
      <rect x="150" y="80" width="106" height="352"/>
    </clipPath>
    <clipPath id="rightDisplayHalf">
      <rect x="256" y="80" width="106" height="352"/>
    </clipPath>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgScreen)" filter="url(#phoneShadow)"/>
  <rect x="33" y="33" width="446" height="446" rx="99" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
  <ellipse cx="256" cy="256" rx="140" ry="170" fill="#00E5FF" fill-opacity="0.04" filter="url(#curtainGlow)"/>
  <ellipse cx="270" cy="270" rx="130" ry="160" fill="#FF007F" fill-opacity="0.04" filter="url(#curtainGlow)"/>
  <rect x="136" y="66" width="240" height="380" rx="46" fill="url(#phoneBezel)" stroke="#111319" stroke-width="4" filter="url(#phoneShadow)"/>
  <rect x="138" y="68" width="236" height="376" rx="44" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
  <g clip-path="url(#phoneDisplayClip)">
    <g clip-path="url(#leftDisplayHalf)">
      <rect x="150" y="80" width="212" height="352" fill="url(#leftScreenBg)"/>
      <rect x="166" y="130" width="180" height="32" rx="8" fill="#00E5FF" fill-opacity="0.2"/>
      <circle cx="182" cy="146" r="8" fill="#00E5FF" fill-opacity="0.6"/>
      <rect x="198" y="142" width="60" height="8" rx="4" fill="#00E5FF" fill-opacity="0.4"/>
      <rect x="166" y="174" width="180" height="74" rx="12" fill="#141E32" stroke="#00E5FF" stroke-opacity="0.2" stroke-width="1.5"/>
      <circle cx="192" cy="204" r="16" fill="url(#cyanAccentGrad)" fill-opacity="0.8"/>
      <rect x="218" y="196" width="80" height="10" rx="5" fill="#00E5FF" fill-opacity="0.5"/>
      <rect x="218" y="212" width="50" height="7" rx="3.5" fill="#00E5FF" fill-opacity="0.3"/>
      <rect x="166" y="260" width="180" height="42" rx="10" fill="#141E32" stroke="#00E5FF" stroke-opacity="0.15" stroke-width="1.5"/>
      <circle cx="184" cy="281" r="9" fill="#00E5FF" fill-opacity="0.4"/>
      <rect x="202" y="277" width="70" height="8" rx="4" fill="#00E5FF" fill-opacity="0.3"/>
      <rect x="166" y="314" width="180" height="44" rx="12" fill="#00E5FF" fill-opacity="0.25"/>
      <rect x="206" y="331" width="100" height="10" rx="5" fill="#00E5FF" fill-opacity="0.6"/>
    </g>
    <g clip-path="url(#rightDisplayHalf)">
      <rect x="150" y="80" width="212" height="352" fill="url(#rightScreenBg)"/>
      <rect x="166" y="130" width="180" height="32" rx="8" fill="#ffffff" fill-opacity="0.12"/>
      <circle cx="182" cy="146" r="8" fill="#ffffff" fill-opacity="0.3"/>
      <rect x="198" y="142" width="60" height="8" rx="4" fill="#ffffff" fill-opacity="0.2"/>
      <rect x="166" y="174" width="180" height="74" rx="12" fill="#2E1225" stroke="#FF007F" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="192" cy="204" r="16" fill="#ffffff" fill-opacity="0.2"/>
      <rect x="218" y="196" width="80" height="10" rx="5" fill="#ffffff" fill-opacity="0.2"/>
      <rect x="218" y="212" width="50" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.15"/>
      <rect x="290" y="190" width="46" height="18" rx="6" fill="url(#neonDiffGrad)" filter="url(#curtainGlow)"/>
      <rect x="166" y="260" width="180" height="42" rx="10" fill="#2E1225" stroke="#FF007F" stroke-opacity="0.3" stroke-width="1.5"/>
      <circle cx="184" cy="281" r="9" fill="#ffffff" fill-opacity="0.2"/>
      <rect x="202" y="277" width="70" height="8" rx="4" fill="#ffffff" fill-opacity="0.15"/>
      <rect x="312" y="273" width="24" height="16" rx="8" fill="url(#neonDiffGrad)"/>
      <rect x="166" y="314" width="180" height="44" rx="12" fill="url(#neonDiffGrad)" filter="url(#curtainGlow)"/>
      <rect x="206" y="331" width="100" height="10" rx="5" fill="#ffffff"/>
    </g>
    <rect x="220" y="92" width="72" height="18" rx="9" fill="#000000" stroke="#222530" stroke-width="1"/>
    <circle cx="276" cy="101" r="4" fill="#0C152B"/>
    <rect x="226" y="418" width="60" height="4" rx="2" fill="#ffffff" fill-opacity="0.4"/>
  </g>
  <line x1="256" y1="72" x2="256" y2="440" stroke="#ffffff" stroke-width="3.5" filter="url(#curtainGlow)"/>
  <rect x="245" y="234" width="22" height="44" rx="11" fill="#ffffff" filter="url(#phoneShadow)"/>
  <rect x="247" y="236" width="18" height="40" rx="9" fill="#181B24"/>
  <line x1="254" y1="248" x2="254" y2="264" stroke="#00E5FF" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="258" y1="248" x2="258" y2="264" stroke="#FF007F" stroke-width="1.8" stroke-linecap="round"/>
</svg>
